id: local_first
title: Prefer local-first solutions
body: 'Prefer solutions that run locally on user-controlled machines or infrastructure.
  Avoid cloud or external dependencies unless they provide clear, necessary advantages
  such as scalability, collaboration, or operational simplicity.'
